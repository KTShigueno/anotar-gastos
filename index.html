<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anotar gastos</title>
<meta name="description" content="Bloco de notas de gastos que funciona sem internet. Os dados ficam só no seu telemóvel.">
<meta name="theme-color" content="#173f8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
:root{
  --bg:#eef2f8; --panel:#ffffff; --panel-2:#f4f6fb; --ink:#14213d; --muted:#5d6883; --line:#dbe2ee;
  --accent:#1c4fb0; --accent-ink:#ffffff; --accent-soft:#e3ebfa; --head:#173f8f; --head-ink:#ffffff; --send:#173f8f; --send-ink:#ffffff;
  --neg:#b4232c; --pos:#18794e; --warn-soft:#fff4dc; --warn-ink:#7a5200; --shadow:0 1px 2px rgba(20,33,61,.06),0 4px 16px rgba(20,33,61,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b1220; --panel:#131c2e; --panel-2:#1a2438; --ink:#e7ecf6; --muted:#9aa6c0; --line:#26324a;
    --accent:#6f9bff; --accent-ink:#0b1220; --accent-soft:#1c2a48; --head:#0f1a30; --head-ink:#e7ecf6; --send:#e7ecf6; --send-ink:#0b1220;
    --neg:#ff7b84; --pos:#4cd59a; --warn-soft:#3a2f12; --warn-ink:#ffd27a; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
button,input{font:inherit;color:inherit}
header{background:var(--head);color:var(--head-ink);padding:calc(env(safe-area-inset-top) + 14px) 18px 16px}
header h1{margin:0;font-size:20px;font-weight:700}
header .tot{margin-top:6px;font-size:14px;opacity:.85}
header .tot b{font-size:22px;opacity:1;display:block;margin-top:2px}
main{padding:14px 14px calc(env(safe-area-inset-bottom) + 110px);max-width:560px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on.d{color:var(--neg)} .seg button.on.r{color:var(--pos)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.inp{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 13px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.amt{font-size:30px;font-weight:700;text-align:center;letter-spacing:.5px}
.row{display:flex;gap:10px;align-items:center;margin-top:12px}
.field{margin-top:12px}
.date-btn{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);width:100%;margin-top:14px;font-size:17px}
.btn.danger{color:var(--neg)}
.btn:disabled{opacity:.5}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:22px 4px 8px;font-weight:700}
.day{margin-top:14px}
.day h3{font-size:13px;color:var(--muted);margin:0 6px 6px;font-weight:600;display:flex;justify-content:space-between}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:12px 14px;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:left}
.item:first-child{border-top:0}
.item .d{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .v{font-weight:700;white-space:nowrap}
.item .v.neg{color:var(--neg)} .item .v.pos{color:var(--pos)}
.item .s{font-size:12px;color:var(--muted);white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar .btn{width:100%;max-width:560px;display:block;margin:0 auto;background:var(--send);color:var(--send-ink);border-color:var(--send)}
.links{text-align:center;margin-top:18px}
.links button{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:14px;padding:8px}
.note{font-size:13px;color:var(--muted);text-align:center;margin:14px 6px 0}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px)}
.sheet h3{margin:0 0 12px;font-size:18px}
.sheet .warn{background:var(--warn-soft);color:var(--warn-ink);border-radius:10px;padding:9px 11px;font-size:14px;margin-bottom:12px}
.sheet .row .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 84px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:30;max-width:90vw;text-align:center}
.tabs{display:flex;gap:6px;margin-top:12px;background:rgba(255,255,255,.12);border-radius:12px;padding:3px}
.tabs button{flex:1;border:0;background:none;color:var(--head-ink);opacity:.8;padding:8px;border-radius:9px;font-weight:600;font-size:15px}
.tabs button.on{background:rgba(255,255,255,.95);color:#173f8f;opacity:1}
[hidden]{display:none!important}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.mnav b{font-size:18px}
.mnav button{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:40px;height:36px;font-size:18px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:20px;margin-top:2px}
.kpi.wide{grid-column:1/-1}
.cat{padding:11px 14px;border-top:1px solid var(--line)}
.cat:first-child{border-top:0}
.cat .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.cat .top span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .top b{white-space:nowrap}
.cat small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.cat small.over{color:var(--neg);font-weight:600}
.meter{height:7px;border-radius:9px;background:var(--panel-2);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:9px}
.help{font-size:14px;color:var(--muted);margin:12px 2px 0;line-height:1.5}
.tag{font-size:11.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 7px;margin-right:4px}
</style>
</head>
<body>
<header>
  <h1>Anotar gastos</h1>
  <div class="tot" id="tot"></div>
  <nav class="tabs" id="tabs"><button type="button" class="on" data-v="anotar">✏️ Anotar</button><button type="button" data-v="resumo">📊 Resumo</button></nav>
</header>
<main id="vAnotar">
  <form class="card" id="form" autocomplete="off">
    <div class="seg" id="type"><button type="button" class="d on" data-t="despesa">Gasto</button><button type="button" class="r" data-t="receita">Entrada</button></div>
    <label for="amt">Quanto?</label>
    <input class="inp amt" id="amt" inputmode="decimal" placeholder="0,00" enterkeyhint="next">
    <div class="field"><label for="desc">O que foi?</label>
    <input class="inp" id="desc" placeholder="Ex.: farmácia, pão, jantar…" maxlength="80" enterkeyhint="done"></div>
    <div class="row" style="justify-content:space-between"><span style="color:var(--muted);font-size:14px">Data</span>
      <span><button type="button" class="date-btn" id="dateBtn"></button><input type="date" id="date" style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px"></span></div>
    <button class="btn primary" type="submit">Anotar</button>
  </form>
  <div id="list"></div>
  <div class="links"><button type="button" id="cleanBtn">Apagar as anotações já enviadas</button></div>
  <p class="note">🔒 As anotações ficam só neste telemóvel. Funciona sem internet.</p>
</main>
<main id="vResumo" hidden></main>
<input type="file" id="cofreInput" hidden>
<div class="bar" id="sendBar"><button class="btn" id="sendBtn" type="button"></button></div>

<script>
'use strict';
const KEY='anotar-gastos-v1';
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DIAS=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const eur=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'EUR'});
const fmt=v=>eur.format(v||0);
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const newId=()=>Date.now().toString(36).slice(-5)+Math.random().toString(36).slice(2,5);

let S={notes:[]}, storageOK=true;
try{ const raw=localStorage.getItem(KEY); if(raw) S=JSON.parse(raw); }catch(e){ storageOK=false; }
if(!Array.isArray(S.notes)) S.notes=[];
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ storageOK=false; toast('Não foi possível salvar neste telemóvel.'); } }
try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}

function parseAmt(s){ s=String(s||'').replace(/[€\s]/g,''); if(!s) return NaN;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); return Math.round(parseFloat(s)*100)/100; }
function dateLabel(iso){ const t=todayISO(); if(iso===t) return 'Hoje';
  const y=new Date(); y.setDate(y.getDate()-1); if(iso===`${y.getFullYear()}-${pad(y.getMonth()+1)}-${pad(y.getDate())}`) return 'Ontem';
  const d=new Date(iso+'T12:00'); return `${DIAS[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`; }
const br=iso=>`${iso.slice(8,10)}/${iso.slice(5,7)}/${iso.slice(0,4)}`;

let type='despesa', date=todayISO();
function setDate(d){ date=d||todayISO(); $('#date').value=date; $('#dateBtn').textContent=dateLabel(date)+' ▾'; }
$('#type').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; type=b.dataset.t; $('#type').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); });
$('#dateBtn').addEventListener('click',()=>{ const i=$('#date'); if(i.showPicker){ try{ i.showPicker(); return; }catch(e){} } i.focus(); i.click(); });
$('#date').addEventListener('change',e=>{ const v=e.target.value; setDate(v&&v<=todayISO()?v:todayISO()); });
$('#amt').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#desc').focus(); } });
$('#form').addEventListener('submit',e=>{
  e.preventDefault();
  const amount=parseAmt($('#amt').value), desc=$('#desc').value.replace(/[\r\n·#]+/g,' ').replace(/\s+/g,' ').trim();
  if(!(amount>0)){ toast('Escreva quanto foi (ex.: 12,50).'); $('#amt').focus(); return; }
  if(!desc){ toast('Escreva o que foi.'); $('#desc').focus(); return; }
  S.notes.push({id:newId(),date,desc,amount,type,created:Date.now(),sent:false}); save();
  $('#amt').value=''; $('#desc').value=''; $('#amt').blur(); $('#desc').blur(); setDate(todayISO());
  render(); toast(type==='receita'?'Entrada anotada.':'Gasto anotado.');
});

function render(){
  const m=todayISO().slice(0,7), mes=S.notes.filter(n=>n.date.startsWith(m));
  const g=mes.filter(n=>n.type!=='receita').reduce((s,n)=>s+n.amount,0);
  $('#tot').innerHTML=`Anotado em ${MESES[+m.slice(5)-1]}<b>${fmt(g)}</b>`;
  const l=[...S.notes].sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);
  if(!l.length){ $('#list').innerHTML='<h2>Anotações</h2><div class="list"><div class="empty">Nada anotado ainda.<br>Anote o primeiro gasto acima.</div></div>'; }
  else{
    const days={}; l.forEach(n=>(days[n.date]=days[n.date]||[]).push(n));
    $('#list').innerHTML='<h2>Anotações</h2>'+Object.entries(days).map(([d,ns])=>{
      const t=ns.filter(n=>n.type!=='receita').reduce((s,n)=>s+n.amount,0);
      return `<div class="day"><h3><span>${esc(dateLabel(d))}</span><span>${t?fmt(t):''}</span></h3><div class="list">${ns.map(n=>`<button type="button" class="item" data-id="${n.id}">
        <span class="d">${esc(n.desc)}</span>${n.sent?'<span class="s">✓ enviada</span>':''}
        <span class="v ${n.type==='receita'?'pos':'neg'}">${n.type==='receita'?'+':'−'}${fmt(n.amount)}</span></button>`).join('')}</div></div>`; }).join('');
  }
  const un=S.notes.filter(n=>!n.sent).length;
  $('#sendBtn').textContent= un ? `Enviar para o computador (${un} nova${un>1?'s':''})` : 'Enviar para o computador';
  $('#sendBtn').disabled=!S.notes.length;
  $('#cleanBtn').style.display=S.notes.some(n=>n.sent)?'':'none';
}

$('#list').addEventListener('click',e=>{ const b=e.target.closest('.item'); if(b) openNote(b.dataset.id); });
function openNote(id){
  const n=S.notes.find(x=>x.id===id); if(!n) return;
  const bg=document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><h3>Editar anotação</h3>
    ${n.sent?'<div class="warn">Esta anotação já foi enviada para o computador. Se mudar aqui, ela vai de novo como nova — e a antiga continua lá. Nesse caso, exclua a antiga no computador.</div>':''}
    <label for="eAmt">Quanto?</label><input class="inp amt" id="eAmt" inputmode="decimal" value="${String(n.amount.toFixed(2)).replace('.',',')}">
    <div class="field"><label for="eDesc">O que foi?</label><input class="inp" id="eDesc" maxlength="80" value="${esc(n.desc)}"></div>
    <div class="field"><label for="eDate">Data</label><input class="inp" id="eDate" type="date" value="${n.date}" max="${todayISO()}"></div>
    <div class="row"><button class="btn danger" data-a="del">Excluir</button><button class="btn" data-a="cancel">Cancelar</button><button class="btn" style="background:var(--accent);color:var(--accent-ink);border-color:var(--accent)" data-a="ok">Salvar</button></div></div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.addEventListener('click',e=>{ if(e.target===bg) return close(); const a=e.target.closest('[data-a]'); if(!a) return; const act=a.dataset.a;
    if(act==='cancel') return close();
    if(act==='del'){ if(!confirm('Excluir esta anotação?')) return; S.notes=S.notes.filter(x=>x!==n); save(); close(); render(); toast('Anotação excluída.'); return; }
    if(act==='ok'){ const amount=parseAmt(bg.querySelector('#eAmt').value), desc=bg.querySelector('#eDesc').value.replace(/[\r\n·#]+/g,' ').replace(/\s+/g,' ').trim(), d=bg.querySelector('#eDate').value;
      if(!(amount>0)) return toast('Escreva quanto foi (ex.: 12,50).'); if(!desc) return toast('Escreva o que foi.'); if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return toast('Escolha uma data.');
      if(amount!==n.amount||desc!==n.desc||d!==n.date){ Object.assign(n,{amount,desc,date:d}); if(n.sent){ n.sent=false; n.id=newId(); } }
      save(); close(); render(); toast('Anotação salva.'); } });
}

function exportText(list){
  return 'Os Meus Gastos — anotações\n'+[...list].sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created)
    .map(n=>`${br(n.date)} · ${n.type==='receita'?'+':'-'}${n.amount.toFixed(2).replace('.',',')} · ${n.desc} #${n.id}`).join('\n')+'\n';
}
$('#sendBtn').addEventListener('click',async()=>{
  let list=S.notes.filter(n=>!n.sent);
  if(!list.length){ if(!confirm('Todas as anotações já foram enviadas. Enviar todas de novo? (O computador ignora as repetidas.)')) return; list=S.notes; }
  const text=exportText(list); let ok=false;
  if(navigator.share){ try{ await navigator.share({title:'Anotações de gastos',text}); ok=true; }catch(e){ if(e&&e.name==='AbortError') return; } }
  if(!ok){ try{ await navigator.clipboard.writeText(text); ok=true; toast('Copiado. Cole numa mensagem para você mesmo.'); }catch(e){} }
  if(!ok){ prompt('Copie o texto abaixo:',text); ok=confirm('Conseguiu copiar e enviar?'); }
  if(ok){ list.forEach(n=>n.sent=true); save(); render(); }
});
$('#cleanBtn').addEventListener('click',()=>{ const n=S.notes.filter(x=>x.sent).length;
  if(!confirm(`Apagar ${n} anotação(ões) já enviada(s) deste telemóvel? Confira antes se elas chegaram ao computador.`)) return;
  S.notes=S.notes.filter(x=>!x.sent); save(); render(); toast('Anotações enviadas apagadas.'); });

let tt; function toast(msg){ let t=$('.toast'); if(!t){ t=document.createElement('div'); t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg; clearTimeout(tt); tt=setTimeout(()=>t.remove(),2600); }

/* ===== Resumo: consulta dos dados do computador (arquivo .cofre do OneDrive, só leitura) ===== */
// O arquivo é criptografado pelo programa do computador (PBKDF2-SHA256 + AES-GCM). Os dados abertos ficam só na memória.
let R=null, rMonth=null, hiddenAt=0;
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const monthName=k=>{ const m=MESES[+k.slice(5)-1]; return m[0].toUpperCase()+m.slice(1)+' '+k.slice(0,4); };
const addMonths=(k,n)=>{ let y=+k.slice(0,4), m=+k.slice(5)-1+n; y+=Math.floor(m/12); m=((m%12)+12)%12; return `${y}-${pad(m+1)}`; };
async function abrirCofre(txt,pw){
  let j; try{ j=JSON.parse(txt); }catch(e){ throw new Error('formato'); }
  if(!j||j.app!=='os-meus-gastos'||!j.data||!j.kdf) throw new Error('formato');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:j.kdf.hash||'SHA-256',salt:unb64(j.kdf.salt),iterations:j.kdf.iter},base,{name:'AES-GCM',length:256},false,['decrypt']);
  let pt; try{ pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(j.iv)},key,unb64(j.data)); }catch(e){ throw new Error('senha'); }
  const d=JSON.parse(new TextDecoder().decode(pt));
  return {tx:Array.isArray(d.transactions)?d.transactions:[], cats:Array.isArray(d.categories)?d.categories:[], savedAt:j.savedAt};
}
function askPw(){ return new Promise(done=>{
  const bg=document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><h3>Senha do arquivo</h3>
    <label for="rPw">A mesma senha que você criou no computador</label><input class="inp" id="rPw" type="password" autocomplete="current-password" enterkeyhint="go">
    <div class="row"><button class="btn" data-a="cancel">Cancelar</button><button class="btn" style="background:var(--accent);color:var(--accent-ink);border-color:var(--accent)" data-a="ok">Abrir</button></div></div>`;
  document.body.appendChild(bg); const inp=bg.querySelector('#rPw'), close=v=>{ bg.remove(); done(v); };
  bg.addEventListener('click',e=>{ if(e.target===bg) return close(null); const a=e.target.closest('[data-a]'); if(!a) return; if(a.dataset.a==='cancel') return close(null); if(inp.value) close(inp.value); });
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&inp.value) close(inp.value); });
  setTimeout(()=>inp.focus(),50); }); }
$('#cofreInput').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const txt=await f.text();
  try{ const j=JSON.parse(txt); if(!j||j.app!=='os-meus-gastos') throw 0; }catch(err){ return toast('Este não é o arquivo de dados do Os Meus Gastos (os-meus-gastos.cofre).'); }
  for(;;){ const pw=await askPw(); if(!pw) return;
    try{ R=await abrirCofre(txt,pw); break; }catch(err){ toast(err.message==='senha'?'Senha incorreta. Tente de novo.':'Não consegui abrir este arquivo.'); if(err.message!=='senha') return; } }
  const old=$('.toast'); if(old) old.remove();
  const t=todayISO().slice(0,7), ms=[...new Set(R.tx.map(x=>x.date.slice(0,7)))].sort();
  rMonth=ms.includes(t)||!ms.length?t:ms[ms.length-1]; renderResumo();
});
function renderResumo(){
  const v=$('#vResumo');
  if(!R){ v.innerHTML=`<div class="card"><h3 style="margin:0 0 6px">📊 Resumo do computador</h3>
    <p style="margin:0;color:var(--muted);font-size:15px">Veja quanto já gastou no mês, por categoria, e como estão os orçamentos — com os dados que o programa do computador guarda no OneDrive. Só para consulta.</p>
    <label class="btn primary" for="cofreInput" style="display:block;text-align:center">Abrir arquivo de dados</label></div>
    <p class="help">Escolha <b>os-meus-gastos.cofre</b> na pasta <b>Os Meus Gastos</b> do OneDrive e digite a sua senha.<br>
    Se o OneDrive não aparecer: no app <b>Arquivos</b>, toque em Procurar → <b>⋯</b> → Editar e ative o OneDrive.</p>
    <p class="note">🔒 A senha e os dados ficam só neste telemóvel, e são apagados da tela quando você fecha o resumo.</p>`; return; }
  const cat=id=>R.cats.find(c=>c.id===id)||R.cats.find(c=>c.id==='outros')||{name:'Sem categoria',icon:'❔',color:'#8a94a8'};
  const counted=t=>!cat(t.cat).ignore, inM=R.tx.filter(t=>t.date.startsWith(rMonth));
  let rec=0,desp=0; const by={}; inM.forEach(t=>{ if(!counted(t)) return; if(t.type==='receita') rec+=t.amount; else { desp+=t.amount; by[t.cat]=(by[t.cat]||0)+t.amount; } });
  const here=S.notes.filter(n=>!n.sent&&n.type!=='receita'&&n.date.startsWith(rMonth)).reduce((s,n)=>s+n.amount,0);
  const cats=R.cats.filter(c=>c.type!=='receita'&&!c.ignore&&((by[c.id]||0)>0||(+c.budget||0)>0)).sort((a,b)=>(by[b.id]||0)-(by[a.id]||0));
  const lanc=[...inM].sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));
  const saved=R.savedAt?new Date(R.savedAt).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
  v.innerHTML=`<div class="mnav"><button type="button" data-m="-1" aria-label="Mês anterior">‹</button><b>${esc(monthName(rMonth))}</b><button type="button" data-m="1" aria-label="Mês seguinte">›</button></div>
   <div class="kpis"><div class="kpi"><span>Gastos</span><b style="color:var(--neg)">${fmt(desp)}</b></div><div class="kpi"><span>Entradas</span><b style="color:var(--pos)">${fmt(rec)}</b></div>
    <div class="kpi wide"><span>Saldo do mês</span><b style="color:${rec-desp<0?'var(--neg)':'var(--pos)'}">${fmt(rec-desp)}</b>${here?`<span style="margin-top:4px;font-weight:500">+ ${fmt(here)} anotados neste telemóvel e ainda não enviados</span>`:''}</div></div>
   <h2>Por categoria</h2>
   <div class="list">${cats.length?cats.map(c=>{ const sp=by[c.id]||0, bud=+c.budget||0, p=bud?sp/bud:0;
     return `<div class="cat"><div class="top"><span>${esc(c.icon||'')} ${esc(c.name)}</span><b>${fmt(sp)}</b></div>
      ${bud?`<div class="meter"><i style="width:${Math.min(100,p*100).toFixed(1)}%;background:${p>1?'var(--neg)':esc(c.color||'var(--accent)')}"></i></div><small class="${p>1?'over':''}">${p>1?`Passou ${fmt(sp-bud)} do orçamento de ${fmt(bud)}`:`${fmt(bud-sp)} livres de ${fmt(bud)}`}</small>`:''}</div>`; }).join('')
     :'<div class="empty">Nenhum gasto neste mês.</div>'}</div>
   <h2>Lançamentos (${lanc.length})</h2>
   <div class="list">${lanc.length?lanc.slice(0,80).map(t=>`<div class="item"><span class="s" style="min-width:38px">${t.date.slice(8,10)}/${t.date.slice(5,7)}</span>
     <span class="d">${t.prov?'<span class="tag">📝</span>':''}${esc(t.notes&&t.nid?t.notes:t.desc)}</span><span class="v ${t.type==='receita'?'pos':'neg'}">${t.type==='receita'?'+':'−'}${fmt(t.amount)}</span></div>`).join('')
     :'<div class="empty">Nenhum lançamento neste mês.</div>'}</div>
   <p class="note">Dados do computador${saved?` salvos em ${esc(saved)}`:''}. Só para consulta.</p>
   <button type="button" class="btn" id="rClose" style="width:100%;margin-top:14px">Fechar o resumo</button>`;
}
$('#vResumo').addEventListener('click',e=>{ const m=e.target.closest('[data-m]'); if(m){ rMonth=addMonths(rMonth,+m.dataset.m); renderResumo(); window.scrollTo(0,0); return; }
  if(e.target.closest('#rClose')){ R=null; renderResumo(); } });
function showView(v){ $('#tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#vAnotar').hidden=v!=='anotar'; $('#sendBar').hidden=v!=='anotar'; $('#vResumo').hidden=v!=='resumo'; if(v==='resumo') renderResumo(); window.scrollTo(0,0); }
$('#tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) showView(b.dataset.v); });
// por segurança, os dados abertos somem depois de 10 minutos com o app em segundo plano
document.addEventListener('visibilitychange',()=>{ if(document.hidden) hiddenAt=Date.now(); else if(R&&hiddenAt&&Date.now()-hiddenAt>10*60*1000){ R=null; renderResumo(); } });

setDate(todayISO()); render();
if(!storageOK) toast('Este navegador não está salvando os dados.');
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
